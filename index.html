<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NYKAA × CETAPHIL — Discover Your Routine</title>
<style>
/* ============================================================
   CONFIG (JS config block is at top of <script> — colors below
   are mirrored as CSS custom properties so both stay in sync)
   ============================================================ */
:root{
  --navy:#0B2545;
  --blue:#1C6DD0;
  --blue-light:#EAF2FB;
  --pink:#E9457B;
  --ink:#16202B;
  --muted:#6B7686;
  --line:#E3E8EF;
  --white:#FFFFFF;
  --radius:16px;
  --shadow:0 8px 24px rgba(11,37,69,.08);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--white);color:var(--ink);}
body{-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--white);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.2px;}
.brandmark .n{color:var(--pink);}
.brandmark .sep{color:var(--line);}
.brandmark .c{color:var(--blue);}
.topbar-actions{display:flex;align-items:center;gap:12px;}
.icon-btn{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:var(--white);display:flex;align-items:center;justify-content:center;
  position:relative;font-size:20px;transition:background .15s ease;
}
.icon-btn:hover{background:var(--blue-light);}
.icon-btn .badge{
  position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;
  font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.back-btn{
  border:none;background:none;color:var(--navy);font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:6px;padding:6px 4px;
}

/* ---------- Progress ---------- */
.progress-wrap{padding:10px 16px 0;max-width:720px;margin:0 auto;width:100%;}
.progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:2px;transition:width .4s ease;}
.progress-label{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600;}

/* ---------- Layout ---------- */
.app{min-height:100vh;display:flex;flex-direction:column;}
.screen{
  flex:1;max-width:720px;margin:0 auto;width:100%;padding:24px 18px 100px;
  animation:fadeUp .35s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .screen,.card,.reveal{animation:none !important;}
}

h1.h1{font-size:28px;line-height:1.15;margin:4px 0 6px;color:var(--navy);font-weight:800;}
p.sub{color:var(--muted);font-size:15px;margin:0 0 22px;line-height:1.5;}
.eyebrow{color:var(--pink);font-weight:700;font-size:13px;margin-bottom:6px;}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
}
.card.flat{box-shadow:none;}
.panel-blue{background:var(--blue-light);border:1px solid #D8E7FA;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:12px;padding:14px 20px;font-weight:700;font-size:15px;border:none;
  width:100%;transition:transform .1s ease, opacity .15s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:#0F2E58;}
.btn-pink{background:var(--pink);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--navy);color:var(--navy);}
.btn-ghost{background:transparent;color:var(--navy);text-decoration:underline;font-weight:600;}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;border-radius:10px;}
.btn:disabled{opacity:.4;pointer-events:none;}

.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0;}
@media(max-width:520px){.choice-grid{grid-template-columns:1fr;}}
.choice-card{
  border:2px solid var(--line);border-radius:20px;padding:30px 18px;text-align:center;
  background:#fff;transition:border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  box-shadow:0 2px 10px rgba(11,37,69,.05);
}
.choice-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,37,69,.1);}
.choice-card.selected{border-color:var(--pink);background:var(--blue-light);}
.choice-emoji{font-size:52px;margin-bottom:14px;line-height:1;}
.choice-title{font-weight:800;font-size:19px;color:var(--navy);}
.choice-desc{font-size:13.5px;color:var(--muted);margin-top:5px;}

.option-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.pill{
  border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13.5px;
  background:#fff;color:var(--ink);font-weight:600;transition:all .15s ease;
}
.pill.selected{border-color:var(--pink);background:var(--pink);color:#fff;}
.pill:disabled{opacity:.35;}
fieldset{border:none;padding:0;margin:0 0 24px;}
legend{font-weight:800;font-size:15px;color:var(--navy);margin-bottom:2px;padding:0;}
.legend-hint{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:block;}

.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;}
@media(max-width:480px){.insight-grid{grid-template-columns:1fr;}}
.insight-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;}
.insight-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
.insight-value{font-size:16px;font-weight:800;color:var(--navy);margin-top:4px;}
.level-bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;}
.level-fill{height:100%;background:var(--pink);border-radius:3px;}

.product-row{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:#fff;box-shadow:0 2px 10px rgba(11,37,69,.05);transition:box-shadow .15s ease, transform .15s ease;}
.product-row:hover{box-shadow:0 8px 20px rgba(11,37,69,.1);transform:translateY(-1px);}
.product-swatch{
  width:92px;height:92px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;font-weight:700;
  overflow:hidden;background:var(--blue-light);border:1px solid #EAEFF6;
}
.product-swatch img{width:100%;height:100%;object-fit:contain;background:#fff;padding:4px;}
.product-info{flex:1;min-width:0;}
.product-name{font-weight:700;font-size:15.5px;color:var(--navy);}
.product-reason{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
.product-price{font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap;}
.product-step-tag{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;}
.remove-x{background:none;border:none;color:var(--muted);font-size:20px;padding:4px 6px;}

.member-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;background:#fff;}
.member-avatar{width:44px;height:44px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;margin-right:12px;}
.member-meta{font-size:12px;color:var(--muted);}

.camera-wrap{position:relative;border-radius:20px;overflow:hidden;background:#0B2545;aspect-ratio:3/4;max-width:360px;margin:0 auto;}
.camera-wrap video, .camera-wrap img.captured{width:100%;height:100%;object-fit:cover;}
.face-guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.face-oval{width:62%;height:72%;border:3px dashed rgba(255,255,255,.85);border-radius:50%;}
.camera-caption{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:12.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5);}

.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#37D3C4,transparent);animation:scan 1.8s linear infinite;}
@keyframes scan{0%{top:5%;}50%{top:90%;}100%{top:5%;}}

.loader-steps{margin-top:22px;}
.loader-step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);padding:6px 0;opacity:.4;transition:opacity .25s ease,color .25s ease;}
.loader-step.active{opacity:1;color:var(--navy);font-weight:700;}
.loader-step .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0;}
.loader-step.active .dot{background:var(--pink);}
.big-progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:16px;}
.big-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));width:0%;transition:width .25s ease;border-radius:4px;}

.funnel-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.funnel-row:last-child{border-bottom:none;}
.funnel-check{color:#1F9D55;font-weight:800;}
.funnel-pending{color:var(--muted);}

.drawer-backdrop{position:fixed;inset:0;background:rgba(11,37,69,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.drawer-backdrop.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:#fff;z-index:61;
  transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:20px;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);
}
.drawer.open{transform:translateX(0);}
.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(11,37,69,.45);z-index:70;display:none;align-items:flex-end;justify-content:center;}
.modal-backdrop.open{display:flex;}
@media(min-width:640px){.modal-backdrop.open{align-items:center;}}
.modal{background:#fff;border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;animation:slideUp .25s ease;}
@media(min-width:640px){.modal{border-radius:20px;}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.field input,.field select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;
}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}

.summary-line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--ink);}
.summary-line.total{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;color:var(--navy);}
.summary-line.savings{color:var(--pink);font-weight:700;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  opacity:0;transition:all .25s ease;z-index:90;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.trust-row{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;}
.trust-chip{background:var(--blue-light);color:var(--navy);font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;}

.hero-visual{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0 8px;}
.hero-visual img{height:150px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(11,37,69,.15));}
@media(max-width:420px){.hero-visual img{height:120px;}}

.launch-section{margin:26px 0;}
.launch-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.launch-badge{background:var(--pink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.4px;padding:5px 10px;border-radius:999px;}
.launch-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
.launch-card{
  flex:0 0 auto;width:150px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;
  text-align:center;box-shadow:0 2px 10px rgba(11,37,69,.05);transition:transform .15s ease, box-shadow .15s ease;
}
.launch-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(11,37,69,.1);}
.launch-card-img{height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.launch-card-img img{max-height:100%;max-width:100%;object-fit:contain;}
.launch-card-name{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.3;min-height:32px;}
.launch-card-price{font-size:12.5px;font-weight:800;color:var(--pink);margin-top:4px;}

.demo-fab{
  position:fixed;bottom:18px;left:18px;z-index:50;background:var(--navy);color:#fff;border:none;
  border-radius:999px;padding:11px 16px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);
}
.analytics-fab{
  position:fixed;bottom:18px;right:18px;z-index:50;background:#fff;color:var(--navy);border:1.5px solid var(--navy);
  border-radius:999px;padding:11px 16px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);
}
.tiny-note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
.center{text-align:center;}
.success-check{width:72px;height:72px;border-radius:50%;background:#1F9D55;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;animation:pop .3s ease;}
@keyframes pop{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
</style>
</head>
<body>

<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<button class="demo-fab" id="demoBtn">⚙ Demo Mode</button>
<button class="analytics-fab" id="analyticsBtn">📊 Journey Analytics</button>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="analyticsDrawer" role="dialog" aria-label="Journey analytics"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<canvas id="captureCanvas" style="display:none"></canvas>

/* ============================================================
   RECOMMENDATION ENGINE
   ============================================================ */
function generateInsights(profile){
  const lvl = (base)=> Math.max(15, Math.min(95, base));
  let oiliness=40, hydration=55, sensitivity=30, pigmentation=25, sunNeed=40, texture=45;
  if(profile.skinType==='oily') oiliness+=35;
  if(profile.skinType==='dry') hydration-=25;
  if(profile.skinType==='sensitive') sensitivity+=45;
  if(profile.skinType==='combination') { oiliness+=15; hydration-=10; }
  if(profile.concerns.includes('acne')) { oiliness+=15; texture+=20; }
  if(profile.concerns.includes('pigmentation')) pigmentation+=45;
  if(profile.concerns.includes('dryness')) hydration-=30;
  if(profile.concerns.includes('sensitivity')) sensitivity+=30;
  if(profile.concerns.includes('ageing')) texture+=15;
  if(profile.concerns.includes('dullness')) texture+=10;
  if(profile.sun==='moderate') sunNeed+=20;
  if(profile.sun==='high') sunNeed+=40;
  if(profile.sun==='prolonged') sunNeed+=55;
  if(profile.lifestyle.includes('outdoor')) sunNeed+=20;
  if(profile.lifestyle.includes('commute')) sunNeed+=10;

  const summaryParts=[];
  if(oiliness>60) summaryParts.push('lightweight, non-heavy daily care');
  else if(hydration<45) summaryParts.push('deeper daily hydration');
  else summaryParts.push('balanced everyday care');
  if(profile.concerns.length) summaryParts.push('targeted care for '+profile.concerns.join(' & '));
  if(sunNeed>55) summaryParts.push('consistent daily sun protection');
  if(profile.reapply==='easier') summaryParts.push('an easier reapplication format for your day');
  const summary = 'Your profile points toward '+summaryParts.join(', ')+'.';

  return {
    oiliness:lvl(oiliness), hydration:lvl(hydration), sensitivity:lvl(sensitivity),
    pigmentation:lvl(pigmentation), sunNeed:lvl(sunNeed), texture:lvl(texture), summary
  };
}

function levelLabel(v){ return v<40?'Low':v<70?'Moderate':'High'; }

function generateRoutine(profile, isChild){
  const items=[];
  const add=(key,reason)=>{ if(!items.find(i=>i.key===key)) items.push({key,reason}); };
  const outdoor = profile.lifestyle.includes('outdoor');
  const commute = profile.lifestyle.includes('commute');

  if(isChild){
    add('cleanser','A gentle first step suitable for young, sensitive skin.');
    add('moisturiser','Everyday hydration formulated to be gentle.');
    if(profile.sun!=='low'){
      add(outdoor?'spf_active':'spf', outdoor
        ? 'Active outdoor protection recommended for their time outside.'
        : 'Sun protection recommended based on daily exposure.');
    }
    return items;
  }

  // Cleanse — oily/combination skin gets the Oily Skin Cleanser, everyone else the Gentle Skin Cleanser.
  if(profile.skinType==='oily' || profile.skinType==='combination'){
    add('cleanser_oily','Recommended to help manage excess oil while cleansing gently.');
  } else {
    add('cleanser','Recommended as a gentle first step for your routine.');
  }

  // Treat — choose the most relevant serum for the strongest concern signalled.
  if(profile.concerns.includes('pigmentation')){
    add('serum_pigmentation','Recommended for your pigmentation concern — formulated with niacinamide and peptides.');
  } else if(profile.concerns.includes('ageing')){
    add('serum_ageing','Recommended for your ageing concern — a peptide-based renewal serum.');
  } else if(profile.skinType==='oily' || profile.concerns.includes('acne')){
    add('serum','Targeted treatment based on your primary skin concerns.');
  }

  // Moisturise — dry/sensitive skin gets the richer Moisturising Cream, others the daily Lotion.
  if(profile.skinType==='dry' || profile.skinType==='sensitive' || profile.concerns.includes('dryness')){
    add('moisturiser_dry','A richer formula chosen for dryness/sensitivity, to help restore the skin barrier.');
  } else {
    add('moisturiser','Daily hydration matched to your skin type.');
  }

  // Night step — offered when pigmentation or ageing is a stated concern.
  if(profile.concerns.includes('pigmentation') || profile.concerns.includes('ageing') || profile.concerns.includes('dullness')){
    add('night_brightening','A brightening night step recommended alongside your daytime routine.');
  }

  // Protect — outdoor/sports lifestyle gets the Mineral Defense Milk, everyone else the Daily Sunscreen Milk.
  if(profile.sun!=='low' || commute || outdoor){
    if(outdoor){
      add('spf_active','Recommended for active outdoor time — sweat- and water-resistant mineral protection.');
    } else {
      add('spf','Recommended for your daily sun exposure and need for consistent everyday protection.');
    }
  }

  // Reapply — convenience-driven mist for commuters or anyone who wants an easier reapplication format.
  if(profile.reapply==='easier' || commute || outdoor){
    add('mist','Recommended because you indicated that convenient reapplication matters.');
  }
  // Outdoor/active lifestyles also get a body mist for reapplying SPF beyond the face.
  if(outdoor){
    add('mist_body','Recommended for reapplying protection on the body during extended time outdoors.');
  }

  if(profile.skinType==='sensitive'){
    items.forEach(i=>{ if(i.key.startsWith('serum')) i.reason='A gentler targeted option, chosen with your sensitivity in mind.'; });
  }
  return items;
}

function startCamera(mode){
  const stage=document.getElementById('scanStage');
  stage.innerHTML=`

  `;
  document.getElementById('cancelCamBtn').onclick=()=>{ stopCamera(); renderScanChoice(mode); };

  navigator.mediaDevices?.getUserMedia({video:{facingMode:'user'}})
    .then(stream=>{
      mediaStream=stream;
      const video=document.getElementById('camVideo');
      if(video){ video.srcObject=stream; }
      document.getElementById('captureBtn').onclick=()=>{
        const canvas=document.getElementById('captureCanvas');
        canvas.width=video.videoWidth||480; canvas.height=video.videoHeight||640;
        canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
        const dataUrl=canvas.toDataURL('image/jpeg',.85);
        stopCamera();
        setCapturedImage(mode,dataUrl);
      };
    })
    .catch(()=>{
      showToast("Camera access isn't available. You can upload a photo instead.");
      renderScanChoice(mode);
    });

        </div>`).join('')}
      <p class="tiny-note">These are qualitative prototype signals for routine personalisation, not clinical measurements.</p>
    </div>
    <button class="btn btn-primary" id="toRoutineBtn">See My Personalised Routine →</button>
  `;
  document.getElementById('toRoutineBtn').onclick=()=>navigateTo(mode==='self'?'routine':'memberRoutine');
}
function capitalize(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : ''; }

/* ============================================================
   SCREEN: ROUTINE (self or member)
   ============================================================ */
function renderRoutine(mode, el){
  el = el || document.getElementById('screenBody');
  const isMember = mode==='member';
  const profile = isMember ? state.familyDraft.profile : state.self.profile;
  const isChild = isMember && state.familyDraft.relationship==='Child';
  let routine = isMember ? (state.familyDraft.routine || (state.familyDraft.routine=generateRoutine(profile,isChild)))
                          : (state.self.routine.length ? state.self.routine : (state.self.routine=generateRoutine(profile,false)));
  if(!isMember) trackEvent('routinesCreated','routine');

  el.innerHTML=`
    <h1 class="h1">${isMember? (state.familyDraft.name||'Their')+"'s Routine" : 'Your Personalised Routine'}</h1>
    <p class="sub">Based on ${isMember?'their':'your'} skin insights and lifestyle.</p>
    <div id="routineList"></div>
    <div class="card panel-blue">
      <div class="summary-line total"><span>Routine total</span><span>₹${routineTotal(routine)}</span></div>
    </div>
    <button class="btn btn-primary" id="routineNextBtn">${isMember? 'Save & Continue →' : (state.shoppingFor==='family' ? 'Continue to Family Builder →' : 'Add Routine to Cart →')}</button>
  `;
  renderRoutineList(routine, isMember, mode);

  document.getElementById('routineNextBtn').onclick=()=>{
    if(isMember){
      saveDraftMember();
      navigateTo('familyHub');
    } else if(state.shoppingFor==='family'){
      navigateTo('familyHub');
    } else {
      addRoutineToCart(state.self.routine, 'You');
      navigateTo('cart');
    }
  };
}

function renderRoutineList(routine, isMember, mode){
  const list=document.getElementById('routineList');
  list.innerHTML = routine.map(item=>{
    const p=PRODUCTS[item.key];
    return `<div class="product-row">
      ${swatchHTML(p)}
      <div class="product-info">
        <div class="product-step-tag">${p.step}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-reason">${item.reason}</div>
      </div>
      <div style="text-align:right;">
        <div class="product-price">₹${p.price}</div>
        <button class="remove-x" data-key="${item.key}" aria-label="Remove ${p.name}">✕</button>
      </div>
    </div>`;
  }).join('') || `<p class="tiny-note">No products in this routine.</p>`;

  list.querySelectorAll('.remove-x').forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.key;
      const arr = isMember ? state.familyDraft.routine : state.self.routine;
      const idx=arr.findIndex(i=>i.key===key);
      if(idx>-1) arr.splice(idx,1);
      saveState();
      renderRoutine(mode);
    };
  });
}

function addRoutineToCart(routine, label){
  routine.forEach(item=>{
    state.cart.push({key:item.key, label});
    trackEvent('productsAdded');
  });
  saveState();
}

/* ============================================================
   FAMILY FLOW
   ============================================================ */
function renderFamilyHub(el){
  el.innerHTML=`
    <h1 class="h1">Build Your Family</h1>
    <p class="sub">Different needs. One healthier tomorrow.</p>
    <div id="memberList"></div>
    <button class="btn btn-outline" id="addMemberBtn">+ Add Family Member</button>
    <div style="height:12px;"></div>
    <button class="btn btn-primary" id="famNextBtn" ${state.family.length===0?'disabled':''}>See Family Plan →</button>
  `;
  renderMemberList();
  document.getElementById('addMemberBtn').onclick=()=>{
    state.familyDraft={ id:'m'+Date.now(), name:'', relationship:'Partner', age:'', profile:blankProfile(), insights:null, routine:[], capturedImage:null };
    state.editingMemberId=null;
    saveState();
    navigateTo('memberProfileEntry');
  };
  document.getElementById('famNextBtn').onclick=()=>navigateTo('familySummary');
}

function renderMemberList(){
  const wrap=document.getElementById('memberList');
  const rows = [
    {label:'YOU', meta:`${state.self.profile?capitalize(state.self.profile.skinType):''} · ${state.self.routine.length} products`, self:true},
    ...state.family.map(m=>({label:m.name.toUpperCase()||m.relationship.toUpperCase(), meta:`${m.age?m.age+' yrs · ':''}${m.routine.length} products`, member:m}))
  ];
  wrap.innerHTML = rows.map((r,idx)=>`
    <div class="member-card">
      <div style="display:flex;align-items:center;">
        <div class="member-avatar">${r.label.charAt(0)}</div>
        <div>
          <div style="font-weight:800;color:var(--navy);font-size:14px;">${r.label}</div>
          <div class="member-meta">${r.meta}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-sm btn-outline" data-view="${idx}">View</button>
        ${r.member?`<button class="btn btn-sm btn-ghost" data-remove="${r.member.id}">Remove</button>`:''}
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-view]').forEach(btn=>{
    btn.onclick=()=>{
      const idx=+btn.dataset.view;
      if(rows[idx].self){ navigateTo('routine'); }
      else { state.familyDraft=rows[idx].member; state.editingMemberId=rows[idx].member.id; saveState(); navigateTo('memberRoutine'); }
    };
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick=()=>{
      state.family=state.family.filter(m=>m.id!==btn.dataset.remove);
      saveState(); renderFamilyHub(document.getElementById('screenBody'));
    };
  });
}

function renderMemberProfileEntry(el){
  const d=state.familyDraft;
  el.innerHTML=`
    <h1 class="h1">Who are you shopping for?</h1>
    <p class="sub">Tell us a little about this family member.</p>
    <div class="field">
      <label for="memRel">Relationship</label>
      <select id="memRel">
        ${['Partner','Child','Parent','Sibling','Other'].map(r=>`<option ${d.relationship===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label for="memName">Name</label><input id="memName" type="text" value="${escapeHtml(d.name)}" placeholder="e.g. Aanya"></div>
    <div class="field"><label for="memAge">Age</label><input id="memAge" type="number" min="0" max="110" value="${d.age}"></div>
    <button class="btn btn-primary" id="memNextBtn">Next →</button>
  `;
  document.getElementById('memNextBtn').onclick=()=>{
    d.relationship=document.getElementById('memRel').value;
    d.name=document.getElementById('memName').value.trim();
    d.age=document.getElementById('memAge').value;
    if(!d.name){ showToast('Please add a name'); return; }
    saveState();
    navigateTo('memberQuestionnaire');
  };
}

function saveDraftMember(){
  const d=state.familyDraft;
  const existingIdx=state.family.findIndex(m=>m.id===d.id);
  if(existingIdx>-1) state.family[existingIdx]=d;
  else { state.family.push(d); trackEvent('familyMembersAdded'); }
  saveState();
}

function renderFamilySummary(el){
  const allMembers=[{label:'You', age:null, routine:state.self.routine, tag:'Daily Routine'}, ...state.family.map(m=>({label:m.name||m.relationship, age:m.age, routine:m.routine, tag:m.relationship==='Child'?'Kids Routine': (m.profile.lifestyle.includes('outdoor')?'Active Routine':'Daily Routine')}))];
  const totalProducts=allMembers.reduce((s,m)=>s+m.routine.length,0);
  el.innerHTML=`
    <h1 class="h1">Your Family's Cetaphil Plan</h1>
    <p class="sub">Different needs. One healthier tomorrow.</p>
    ${allMembers.map(m=>`
      <div class="member-card">
        <div style="display:flex;align-items:center;">
          <div class="member-avatar">${m.label.charAt(0).toUpperCase()}</div>
          <div>
            <div style="font-weight:800;color:var(--navy);font-size:14px;">${m.label.toUpperCase()}</div>
            <div class="member-meta">${m.age?m.age+' yrs · ':''}${m.tag} · ${m.routine.length} products</div>
          </div>
        </div>
      </div>`).join('')}
    <div class="card panel-blue">
      <div class="summary-line total"><span>Total</span><span>${totalProducts} products</span></div>
    </div>
    <button class="btn btn-pink" id="addFamilyCartBtn">Add Family Cart →</button>
  `;
  document.getElementById('addFamilyCartBtn').onclick=()=>{
    state.cart=[];
    addRoutineToCart(state.self.routine,'You');
    state.family.forEach(m=>addRoutineToCart(m.routine, m.name||m.relationship));
    navigateTo('cart');
  };
}

/* ============================================================
   CART / CHECKOUT / CONFIRMATION
   ============================================================ */
function renderCart(el){
  const groups={};
  state.cart.forEach(item=>{ (groups[item.label]=groups[item.label]||[]).push(item.key); });
  const subtotal=state.cart.reduce((s,i)=>s+PRODUCTS[i.key].price,0);
  const savings=Math.round(subtotal*0.08);
  const delivery = subtotal>0?0:0;
  const total=subtotal-savings+delivery;

  el.innerHTML=`
    <h1 class="h1">Your Cart</h1>
    ${state.cart.length===0?`<p class="sub">Your cart is empty.</p>`:''}
    ${Object.entries(groups).map(([label,keys])=>`
      <div class="card">
        <div style="font-weight:800;color:var(--navy);margin-bottom:8px;">${label} — Routine</div>
        ${keys.map(k=>{ const p=PRODUCTS[k];
          return `<div class="product-row">
            ${swatchHTML(p)}
            <div class="product-info"><div class="product-name">${p.name}</div><div class="product-reason">Qty 1</div></div>
            <div class="product-price">₹${p.price}</div>
          </div>`;}).join('')}
      </div>`).join('')}
    ${state.cart.length? `
    <div class="card">
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;">
        <input type="checkbox" id="subscribeToggle"> Subscribe &amp; Save 8%
      </label>
    </div>
    <div class="card panel-blue">
      <div class="summary-line"><span>Subtotal</span><span>₹${subtotal}</span></div>
      <div class="summary-line savings" id="savingsLine" style="display:none;"><span>Routine Savings</span><span>-₹${savings}</span></div>
      <div class="summary-line"><span>Delivery</span><span>Free</span></div>
      <div class="summary-line total" id="totalLine"><span>Total</span><span>₹${subtotal}</span></div>
    </div>
    <button class="btn btn-pink" id="checkoutBtn">Proceed to Checkout →</button>
    ` : `<button class="btn btn-primary" id="startShoppingBtn">Start Building a Routine</button>`}
  `;
  if(state.cart.length){
    const sub=document.getElementById('subscribeToggle');
    sub.onchange=()=>{
      document.getElementById('savingsLine').style.display = sub.checked?'flex':'none';
      document.querySelector('#totalLine span:last-child').textContent = '₹'+(sub.checked?total:subtotal);
    };
    document.getElementById('checkoutBtn').onclick=()=>{ trackEvent('checkoutStarted','checkout'); navigateTo('checkout'); };
  } else {
    document.getElementById('startShoppingBtn').onclick=()=>navigateTo('entry');
  }
}

function renderCheckout(el){
  const total=state.cart.reduce((s,i)=>s+PRODUCTS[i.key].price,0);
  el.innerHTML=`
    <h1 class="h1">Secure Checkout</h1>
    <div class="card">
      <div style="font-weight:800;color:var(--navy);margin-bottom:10px;">Delivery Address</div>
      <div class="field"><label for="ckName">Full Name</label><input id="ckName" value="Demo User"></div>
      <div class="field"><label for="ckPhone">Phone</label><input id="ckPhone" value="98765 43210"></div>
      <div class="field"><label for="ckAddr">Address</label><input id="ckAddr" value="123, MG Road"></div>
      <div class="field"><label for="ckPin">Pincode</label><input id="ckPin" value="560001"></div>
    </div>
    <div class="card">
      <div style="font-weight:800;color:var(--navy);margin-bottom:10px;">Payment Method</div>
      <div class="option-grid">
        <button class="pill selected" data-pay="upi">UPI</button>
        <button class="pill" data-pay="card">Card</button>
        <button class="pill" data-pay="cod">Cash on Delivery</button>
      </div>
    </div>
    <div class="card panel-blue">
      <div class="summary-line total"><span>Order Total</span><span>₹${total}</span></div>
    </div>
    <button class="btn btn-primary" id="placeOrderBtn">Place Order</button>
  `;
  el.querySelectorAll('[data-pay]').forEach(btn=>{
    btn.onclick=()=>{ el.querySelectorAll('[data-pay]').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); };
  });
  document.getElementById('placeOrderBtn').onclick=()=>{
    const total=state.cart.reduce((s,i)=>s+PRODUCTS[i.key].price,0);
    state.order={ id:'CTF'+Math.floor(100000+Math.random()*899999), total, count:state.cart.length };
    trackEvent('ordersCompleted','order');
    state.cart=[];
    saveState();
    navigateTo('confirmation');
  };
}

function renderConfirmation(el){
  const o=state.order||{id:'—',total:0,count:0};
  el.innerHTML=`
    <div class="success-check">✓</div>
    <h1 class="h1 center" style="text-align:center;">Your Cetaphil routine is on its way.</h1>
    <p class="sub center" style="text-align:center;">Order #${o.id}</p>
    <div class="card">
      <div class="summary-line"><span>Products</span><span>${o.count}</span></div>
      <div class="summary-line"><span>Order Value</span><span>₹${o.total}</span></div>
      <div class="summary-line"><span>Delivery Estimate</span><span>3–5 days</span></div>
    </div>
    ${state.shoppingFor==='family'?`<div class="card panel-blue center"><b>One cart. Multiple routines.<br>One healthier tomorrow.</b></div>`:''}
    <button class="btn btn-outline" id="viewJourneyBtn">View Your Journey</button>
    <div style="height:10px;"></div>
    <button class="btn btn-ghost" id="startAgainBtn">Start Again</button>
  `;
  document.getElementById('viewJourneyBtn').onclick=openAnalyticsDrawer;
  document.getElementById('startAgainBtn').onclick=resetExperience;
}

/* ============================================================
   ANALYTICS DRAWER
   ============================================================ */
function renderAnalyticsDrawer(){
  const d=document.getElementById('analyticsDrawer');
  const a=state.analytics, f=state.funnel;
  const funnelSteps=[
    ['discovery','Discovery'], ['builder','Routine Builder'], ['scan','Skin Analysis'],
    ['report','Personalised Report'], ['routine','Routine Built'], ['cart','Added to Cart'],
    ['checkout','Checkout'], ['order','Order Completed']
  ];
  const productsCount = state.self.routine.length + state.family.reduce((s,m)=>s+m.routine.length,0);
  const aov = state.order ? state.order.total : (state.self.routine.length? routineTotal(state.self.routine):0);
  d.innerHTML=`
    <div class="drawer-header">
      <div style="font-weight:800;color:var(--navy);">CETAPHIL × NYKAA<br>Journey Analytics</div>
      <button class="icon-btn" id="closeDrawerBtn" aria-label="Close">✕</button>
    </div>
    <p class="tiny-note">Live prototype journey data — this reflects your movement through this single demo session, not real market traction.</p>
    <div class="card flat" style="border:1px solid var(--line);">
      <div style="font-weight:800;margin-bottom:8px;color:var(--navy);">Funnel</div>
      ${funnelSteps.map(([k,l])=>`<div class="funnel-row"><span>${l}</span><span class="${f[k]?'funnel-check':'funnel-pending'}">${f[k]?'✓':'—'}</span></div>`).join('')}
    </div>
    <div class="card flat" style="border:1px solid var(--line);">
      <div style="font-weight:800;margin-bottom:8px;color:var(--navy);">Session Events</div>
      ${Object.entries(a).map(([k,v])=>`<div class="funnel-row"><span>${splitCamel(k)}</span><span>${v}</span></div>`).join('')}
    </div>
    <div class="card flat" style="border:1px solid var(--line);">
      <div style="font-weight:800;margin-bottom:8px;color:var(--navy);">Snapshot</div>
      <div class="funnel-row"><span>Products / Routine (you)</span><span>${state.self.routine.length}</span></div>
      <div class="funnel-row"><span>Family vs Individual</span><span>${state.shoppingFor==='family'?'Family':'Individual'}</span></div>
      <div class="funnel-row"><span>Family Members Added</span><span>${state.family.length}</span></div>
      <div class="funnel-row"><span>Total Products in Plan</span><span>${productsCount}</span></div>
      <div class="funnel-row"><span>Order Value (AOV)</span><span>₹${aov}</span></div>
    </div>
  `;
  document.getElementById('closeDrawerBtn').onclick=closeAnalyticsDrawer;
}
function splitCamel(s){ return s.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()); }
function openAnalyticsDrawer(){
  document.getElementById('analyticsDrawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
}
function closeAnalyticsDrawer(){
  document.getElementById('analyticsDrawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
}
document.getElementById('analyticsBtn').onclick=openAnalyticsDrawer;
document.getElementById('drawerBackdrop').onclick=closeAnalyticsDrawer;

/* ============================================================
   DEMO MODE
   ============================================================ */
document.getElementById('demoBtn').onclick=()=>{
  openModal(`
    <h2 style="margin:0 0 14px;color:var(--navy);">Demo Mode</h2>
    <button class="btn btn-outline" id="loadSampleProfileBtn">Load Sample Profile (Self)</button>
    <div style="height:10px;"></div>
    <button class="btn btn-outline" id="loadSampleFamilyBtn">Load Sample Family</button>
    <div style="height:10px;"></div>
    <button class="btn btn-outline" id="viewAnalyticsModalBtn">View Analytics</button>
    <div style="height:10px;"></div>
    <button class="btn btn-pink" id="resetModalBtn">Reset Experience</button>
  `);
  document.getElementById('loadSampleProfileBtn').onclick=()=>{
    state.shoppingFor='self';
    state.self.profile=JSON.parse(JSON.stringify(DEMO_SETTINGS.sampleProfile));
    state.self.insights=generateInsights(state.self.profile);
    state.self.routine=generateRoutine(state.self.profile,false);
    trackEvent('profilesCompleted'); trackEvent('scansCompleted','scan'); trackEvent('reportsGenerated','report'); trackEvent('routinesCreated','routine');
    closeModal(); navigateTo('report');
  };
  document.getElementById('loadSampleFamilyBtn').onclick=()=>{
    state.shoppingFor='family';
    if(!state.self.profile){ state.self.profile=JSON.parse(JSON.stringify(DEMO_SETTINGS.sampleProfile)); state.self.routine=generateRoutine(state.self.profile,false); }
    state.family = DEMO_SETTINGS.sampleFamily.map((m,idx)=>{
      const profile={skinType:m.skinType,concerns:m.concerns,lifestyle:m.lifestyle,sun:m.sun,reapply:m.reapply};
      return { id:'demo'+idx, name:m.name, relationship:m.relationship, age:m.age, profile, insights:generateInsights(profile), routine:generateRoutine(profile, m.relationship==='Child'), capturedImage:null };
    });
    trackEvent('familyMembersAdded'); trackEvent('familyMembersAdded');
    closeModal(); navigateTo('familySummary');
  };
  document.getElementById('viewAnalyticsModalBtn').onclick=()=>{ closeModal(); openAnalyticsDrawer(); };
  document.getElementById('resetModalBtn').onclick=()=>{ closeModal(); resetExperience(); };
};

function resetExperience(){
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(html){
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').onclick=(e)=>{ if(e.target.id==='modalBackdrop') closeModal(); };

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
</body>
</html>
